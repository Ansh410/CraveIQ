<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Restaurant</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <div class="logo">
        <img src="img/logo.png" alt="Logo">
    </div>

    <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="investor.html">Investor Relations</a></li>
        <li><a href="login.html">Login</a></li>
        <li><a href="signup.html">Signup</a></li>
    </ul>
</header>

<main>

<section class="form-container">
    <h2>Add Your Restaurant 🍽️</h2>
    <p>Join our platform and reach thousands of customers.</p>

    <form>
        <input type="text" placeholder="Restaurant Name" required>
        
        <input type="text" placeholder="Owner Name" required>

        <input type="tel" placeholder="Phone Number" required>

        <input type="email" placeholder="Email Address" required>

        <input type="text" placeholder="City" required>

        <input type="text" placeholder="Full Address" required>

        <select required>
            <option value="">Select Cuisine Type</option>
            <option>Indian</option>
            <option>Chinese</option>
            <option>Italian</option>
            <option>Fast Food</option>
            <option>Continental</option>
        </select>

        <button type="submit">Submit Restaurant</button>
    </form>

    <p style="margin-top:15px;">
        Already registered? <a href="login.html">Login here</a>
    </p>
</section>

</main>

<footer>
    © 2026 Food Delivery Platform
</footer>

</body>
</html>
